[project]
name = "commodity-return-forecasting"
version = "1.0.0"
description = "Walk-forward validated commodity return forecasting with ML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "shap>=0.43",
]
